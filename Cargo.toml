[package]
name = "onmap"
version = "0.3.1"
edition = "2024"
build = "build.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.26.0"
crossterm = "0.27.0"
rand = "0.8.5"
tokio = { version = "1.44.2", features = ["full"] }
pnet = "0.33.0"
prettytable = "0.10"
chrono = "0.4"
futures = "0.3"
trust-dns-resolver = { version = "*", features = ["testing"] }
dns-lookup = "1.0"
nix = { version = "0.28", features = ["user"] }


chrono-tz = "0.8"
iana-time-zone = "0.1"

serde_json = "1.0"
itoa = "1"
ping = "0.3"
regex = "1"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
serde_json = "1.0"
