[package]
name = "onmap"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.26.0"
crossterm = "0.27.0"
rand = "0.8.5"
tokio = { version = "1.44.2", features = ["full"] }
pnet = "0.33.0"
prettytable = "0.10"
chrono = "0.4"
futures = "0.3"
trust-dns-resolver = { version = "*", features = ["testing"] }
local-ip-address = "0.5.6"


chrono-tz = "0.8"
iana-time-zone = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ping = "0.3"

