[package]
name = "Onmap"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.26.0"
crossterm = "0.27.0"
rand = "0.8.5"
async-std = { version = "1.13", features = ["attributes"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
chrono = "0.4"
chrono-tz = "0.8"
iana-time-zone = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ping = "0.3"

